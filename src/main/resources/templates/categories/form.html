<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
  <title th:text="${title}">Form</title>
</head>
<body>
<section layout:fragment="content">
  <h1 class="h4 mb-3" th:text="${title}">Form</h1>

  <div class="card shadow-sm">
    <div class="card-body">
      <form th:action="${category.id} != null ? @{|/categories/${category.id}|} : @{/categories}"
            th:object="${category}" method="post">

        <div class="mb-3">
          <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
          <input type="text" th:field="*{name}" class="form-control" placeholder="VD: Laptop">
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Mô tả</label>
          <textarea th:field="*{description}" class="form-control" rows="3"
                    placeholder="Mô tả ngắn gọn..."></textarea>
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary btn-round">💾 Lưu</button>
          <a th:href="@{/categories}" class="btn btn-outline-secondary btn-round">↩ Trở về</a>
        </div>
      </form>
    </div>
  </div>
</section>
</body>
</html>
