<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{iotstar.value.addCate}">Add/Edit Category</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
  <div th:replace="fragments/header :: fragment"></div>

  <h2 th:text="#{iotstar.value.addCate}">Add Category</h2>

  <form th:action="@{/category/save}" th:object="${category}" method="post">
    <input type="hidden" th:field="*{categoryId}" />
    <div>
      <label th:text="#{iotstar.value.name}">Name</label>
      <input type="text" th:field="*{name}" required="required" />
    </div>
    <div>
      <button type="submit" th:text="#{iotstar.value.save}">Save</button>
      <a th:href="@{/categories}" th:text="#{iotstar.value.cancel}">Cancel</a>
    </div>
  </form>

  <div th:replace="fragments/footer :: fragment"></div>
</body>
</html>
